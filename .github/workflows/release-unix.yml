name: Release Linux and macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unix-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RID: ${{ matrix.rid }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate release
        run: |
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          gh release view "$RELEASE_TAG" --json tagName --jq .tagName | grep -Fx "$RELEASE_TAG"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libice6 libsm6 libx11-6 libxext6 libxrender1 fonts-dejavu-core
      - name: Test editor and bundled decompiler
        run: dotnet run --project tests/EastwardModTool.Tests -c Release
      - name: Publish self-contained application
        run: dotnet publish EastwardModTool -c Release -r "$RID" --self-contained true -p:Version="$VERSION" -o publish/app
      - name: Test native library in published output
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then library=libeastward-luajit.dylib; else library=libeastward-luajit.so; fi
          dotnet run --project EastwardLib/tests/EastwardLib.Tests -c Release -- --native "$PWD/publish/app/$library"
          test -x publish/app/EastwardModTool
          test -d publish/app/licenses
      - name: Package application
        run: |
          mkdir -p artifacts
          if [[ "$RUNNER_OS" == macOS ]]; then
            bundle=publish/EastwardModTool.app
            mkdir -p "$bundle/Contents/MacOS"
            cp -a publish/app/. "$bundle/Contents/MacOS/"
            mkdir -p "$bundle/Contents/Resources"
            mv "$bundle/Contents/MacOS/licenses" "$bundle/Contents/Resources/licenses"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string io.github.vriskaserket51.eastwardmodtool' "$bundle/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleName string EastwardModTool' "$bundle/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string EastwardModTool' "$bundle/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$bundle/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${VERSION%%-*}" "$bundle/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${VERSION%%-*}" "$bundle/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :NSHighResolutionCapable bool true' "$bundle/Contents/Info.plist"
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
            tar -czf "artifacts/EastwardModTool-$VERSION-$RID.tar.gz" -C publish EastwardModTool.app
          else
            mv publish/app publish/EastwardModTool
            tar -czf "artifacts/EastwardModTool-$VERSION-$RID.tar.gz" -C publish EastwardModTool
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
      - name: Upload to existing release
        run: gh release upload "$RELEASE_TAG" artifacts/*.tar.gz --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish complete release
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          for suffix in win-x64.zip linux-x64.tar.gz linux-arm64.tar.gz osx-x64.tar.gz osx-arm64.tar.gz; do
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "EastwardModTool-$version-$suffix"
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest
